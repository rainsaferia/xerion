[project]
name = "project-intelligence-backend"
version = "0.1.0"
description = "Project Intelligence Platform - API and worker (modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "pyjwt>=2.15.1",
    "tzdata>=2026.6",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.22.1",
    "pip-audit>=2.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "openpyxl", "openpyxl.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["app", "tests"]
search-path = ["."]

